# Build is handled by GitHub Actions (.github/workflows/deploy.yml)
# Netlify only serves the pre-built files from dist/codesync-frontend/browser
[build]
  publish = "dist/codesync-frontend/browser"

# ── OAuth2 callback — must come BEFORE the SPA wildcard ──────────────────────
# This serves index.html for /oauth2/callback WITHOUT a server-side redirect.
# A redirect would strip the #fragment (token), breaking OAuth login.
# status=200 means "rewrite silently" — the URL stays as /oauth2/callback
# and Angular reads window.location.hash to get the token.
[[redirects]]
  from   = "/oauth2/callback"
  to     = "/index.html"
  status = 200

# ── SPA fallback (all other routes) ──────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ─────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-XSS-Protection       = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# ── Cache hashed assets forever ──────────────────────────────────────────────
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"