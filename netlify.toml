# ── CodeSync — Netlify Build Config ─────────────────────────────────────────

[build]
  # 1. Write environment.prod.ts from Netlify env vars, then build
  command = """
    printf 'export const environment = {\\n  production: true,\\n  apiBase: \"%s\",\\n  wsCollabEndpoint: \"%s\",\\n  wsNotificationEndpoint: \"%s\",\\n  wsExecutionEndpoint: \"%s\"\\n};\\n' \
      \"$ANGULAR_API_BASE\" \"$ANGULAR_WS_COLLAB\" \"$ANGULAR_WS_NOTIF\" \"$ANGULAR_WS_EXEC\" \
      > src/environments/environment.prod.ts &&
    npm ci &&
    npm run build -- --configuration=production
  """
  publish = "dist/codesync-frontend/browser"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION  = "9"

# ── SPA fallback ─────────────────────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ─────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-XSS-Protection       = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# ── Cache hashed assets forever ──────────────────────────────────────────────
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"