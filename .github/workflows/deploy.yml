name: Build & Deploy to Netlify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Run Jest Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --passWithNoTests --forceExit

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - run: npm ci

      # ── Generate environment.prod.ts from secrets (file is gitignored) ──
      - name: Generate environment.prod.ts
        run: |
          mkdir -p src/environments
          cat > src/environments/environment.prod.ts << ENVEOF
          export const environment = {
            production: true,
            apiBase: '${{ secrets.ANGULAR_API_BASE }}',
            wsCollabEndpoint: '${{ secrets.ANGULAR_WS_COLLAB }}',
            wsNotificationEndpoint: '${{ secrets.ANGULAR_WS_NOTIF }}',
            wsExecutionEndpoint: '${{ secrets.ANGULAR_WS_EXEC }}'
          };
          ENVEOF

      - name: Build — Production
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: npm run build -- --configuration=production

      - name: Build — Preview (PR)
        if: github.event_name == 'pull_request'
        run: npm run build -- --configuration=production

      - name: Deploy to Netlify (Production)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './dist/codesync-frontend/browser'
          production-branch: main
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy ${{ github.sha }}"
          enable-pull-request-comment: true
          enable-commit-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 10

      - name: Deploy to Netlify (Preview)
        if: github.event_name == 'pull_request'
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './dist/codesync-frontend/browser'
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Preview PR #${{ github.event.number }}"
          enable-pull-request-comment: true
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 10
