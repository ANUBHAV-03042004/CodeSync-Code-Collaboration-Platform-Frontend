name: CI / CD — Test → Build → Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Run Jest Tests ──────────────────────────────────────────────────
  test:
    name: Run Jest Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --forceExit --passWithNoTests --ci

  # ── Job 2: Build & Deploy (only on push to main, only if tests pass) ───────
  deploy:
    name: Build & Deploy to Netlify
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write environment.prod.ts
        env:
          API_BASE: ${{ secrets.ANGULAR_API_BASE }}
          WS_COLLAB: ${{ secrets.ANGULAR_WS_COLLAB }}
          WS_NOTIF: ${{ secrets.ANGULAR_WS_NOTIF }}
          WS_EXEC: ${{ secrets.ANGULAR_WS_EXEC }}
        run: |
          {
            echo "export const environment = {"
            echo "  production: true,"
            echo "  apiBase:                '${API_BASE}',"
            echo "  wsCollabEndpoint:       '${WS_COLLAB}',"
            echo "  wsNotificationEndpoint: '${WS_NOTIF}',"
            echo "  wsExecutionEndpoint:    '${WS_EXEC}'"
            echo "};"
          } > src/environments/environment.prod.ts
          echo "=== Verifying environment.prod.ts ==="
          cat src/environments/environment.prod.ts

      - name: Build Angular (production)
        run: npm run build -- --configuration=production

      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=dist/codesync-frontend/browser --prod --message "Deploy from GitHub Actions — ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}