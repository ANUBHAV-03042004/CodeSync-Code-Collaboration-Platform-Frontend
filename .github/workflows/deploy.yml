# ── CodeSync — Netlify Deploy Pipeline ─────────────────────────────────────
name: Build & Deploy to Netlify

on:
  push:
    branches: [main, master]          # auto-deploy on every push to main
  pull_request:
    branches: [main, master]          # preview deploy on every PR
  workflow_dispatch:                  # manual trigger from GitHub UI

jobs:
  # ── 1. Test ─────────────────────────────────────────────────────────────
  test:
    name: Run Jest Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --passWithNoTests --forceExit

  # ── 2. Build & Deploy ────────────────────────────────────────────────────
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: test                        # only deploy if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci


      # Inject Netlify environment variables into Angular env file
      - name: Inject environment variables
        run: |
          sed -i "s|%%ANGULAR_API_BASE%%|${{ secrets.ANGULAR_API_BASE }}|g" src/environments/environment.prod.ts
          sed -i "s|%%ANGULAR_WS_COLLAB%%|${{ secrets.ANGULAR_WS_COLLAB }}|g" src/environments/environment.prod.ts
          sed -i "s|%%ANGULAR_WS_NOTIF%%|${{ secrets.ANGULAR_WS_NOTIF }}|g" src/environments/environment.prod.ts
          sed -i "s|%%ANGULAR_WS_EXEC%%|${{ secrets.ANGULAR_WS_EXEC }}|g" src/environments/environment.prod.ts

      # Production build (main/master branch)
      - name: Build — Production
        if: github.event_name == 'push'
        run: npm run build -- --configuration=production
        env:
          # Override API base URL at build time via environment variable
          # (set this in GitHub Secrets as VITE_API_BASE or via angular env replacement)
          NODE_ENV: production

      # Preview build (pull requests)
      - name: Build — Preview
        if: github.event_name == 'pull_request'
        run: npm run build -- --configuration=production

      # ── Deploy to Netlify ─────────────────────────────────────────────
      - name: Deploy to Netlify (Production)
        if: github.event_name == 'push'
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './dist/codesync-frontend/browser'
          production-branch: main
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub — ${{ github.sha }}"
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 10

      - name: Deploy to Netlify (Preview)
        if: github.event_name == 'pull_request'
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './dist/codesync-frontend/browser'
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Preview deploy — PR #${{ github.event.number }}"
          enable-pull-request-comment: true
          enable-commit-comment: false
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 10
