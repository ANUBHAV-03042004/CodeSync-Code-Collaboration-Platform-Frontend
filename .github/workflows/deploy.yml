name: CI / CD — Test → Build → Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Run Jest Tests ──────────────────────────────────────────────────
  test:
    name: Run Jest Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --forceExit --passWithNoTests --ci

  # ── Job 2: Build & Deploy (only on push to main, only if tests pass) ───────
  deploy:
    name: Build & Deploy to Netlify
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write environment.prod.ts
        env:
          API_BASE: ${{ secrets.ANGULAR_API_BASE }}
          WS_COLLAB: ${{ secrets.ANGULAR_WS_COLLAB }}
          WS_NOTIF: ${{ secrets.ANGULAR_WS_NOTIF }}
          WS_EXEC: ${{ secrets.ANGULAR_WS_EXEC }}
        run: |
          python3 - << 'PYEOF'
          import os
          api_base  = os.environ['API_BASE']
          ws_collab = os.environ['WS_COLLAB']
          ws_notif  = os.environ['WS_NOTIF']
          ws_exec   = os.environ['WS_EXEC']
          content = f"""export const environment = {{
            production: true,
            apiBase:                '{api_base}',
            wsCollabEndpoint:       '{ws_collab}',
            wsNotificationEndpoint: '{ws_notif}',
            wsExecutionEndpoint:    '{ws_exec}'
          }};
          """
          with open('src/environments/environment.prod.ts', 'w') as f:
              f.write(content)
          print(f"apiBase length: {len(api_base)} chars")
          print(f"wsCollabEndpoint length: {len(ws_collab)} chars")
          print(f"wsNotifEndpoint length: {len(ws_notif)} chars")
          print(f"wsExecEndpoint length: {len(ws_exec)} chars")
          PYEOF

      - name: Build Angular (production)
        run: npm run build -- --configuration=production

      - name: Deploy to Netlify
        run: |
          npm install -g netlify-cli
          netlify deploy --dir=dist/codesync-frontend/browser --prod --message "Deploy from GitHub Actions — ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}