# ── CodeSync — alwaysdata Deploy Pipeline ────────────────────────────────────
name: Build & Deploy to alwaysdata

on:
  push:
    branches: [main, master]      # auto deploy on every push to main
  workflow_dispatch:               # manual trigger from GitHub UI

jobs:
  # ── 1. Test ──────────────────────────────────────────────────────────────
  test:
    name: Run Jest Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --passWithNoTests --forceExit

  # ── 2. Build & Deploy ─────────────────────────────────────────────────────
  deploy:
    name: Build & Deploy to alwaysdata
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Inject API URLs into Angular prod environment before building
      - name: Inject environment variables
        run: |
          sed -i "s|%%API_BASE%%|${{ secrets.API_BASE }}|g"       src/environments/environment.prod.ts
          sed -i "s|%%WS_COLLAB%%|${{ secrets.WS_COLLAB }}|g"     src/environments/environment.prod.ts
          sed -i "s|%%WS_NOTIF%%|${{ secrets.WS_NOTIF }}|g"       src/environments/environment.prod.ts
          sed -i "s|%%WS_EXEC%%|${{ secrets.WS_EXEC }}|g"         src/environments/environment.prod.ts

      - name: Build — Production
        run: npm run build -- --configuration=production

      # Copy .htaccess into the dist folder so it gets uploaded
      - name: Copy .htaccess to dist
        run: cp .htaccess dist/codesync-frontend/browser/.htaccess

      # Add SSH key from GitHub Secret
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ALWAYSDATA_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Trust alwaysdata SSH host key
          ssh-keyscan -H ssh-${{ secrets.ALWAYSDATA_ACCOUNT }}.alwaysdata.net >> ~/.ssh/known_hosts

      # rsync: upload dist/ → alwaysdata www/codesync/
      - name: Deploy via rsync to alwaysdata
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            dist/codesync-frontend/browser/ \
            ${{ secrets.ALWAYSDATA_ACCOUNT }}@ssh-${{ secrets.ALWAYSDATA_ACCOUNT }}.alwaysdata.net:www/codesync/

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519

      - name: Deployment summary
        run: |
          echo "✅ Deployed to https://${{ secrets.ALWAYSDATA_ACCOUNT }}.alwaysdata.net/codesync"
          echo "📦 Commit: ${{ github.sha }}"
          echo "🕐 Time: $(date -u)"
